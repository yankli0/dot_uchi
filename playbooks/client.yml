---
- name: Configure client base
  ansible.builtin.import_playbook: base.yml
  vars:
    setup_hosts: client
  tags: [client]

- name: Configure client applications
  hosts: client
  tags: [client]
  tasks:
    - name: Install selected client apps
      ansible.builtin.import_role:
        name: client/apps
      tags: [apps, flatpak]
    - name: Install browser apps
      ansible.builtin.import_role:
        name: client/apps
        tasks_from: browser.yml
      tags: [browser, never]
    - name: Install communication apps
      ansible.builtin.import_role:
        name: client/apps
        tasks_from: communication.yml
      tags: [communication, never]
    - name: Install notes apps
      ansible.builtin.import_role:
        name: client/apps
        tasks_from: notes.yml
      tags: [notes, never]
    - name: Install 3D modeling apps
      ansible.builtin.import_role:
        name: client/apps
        tasks_from: 3d-modeling.yml
      tags: [3d-modeling, never]
    - name: Configure Neovim
      ansible.builtin.import_role:
        name: ../roles/client/neovim
      tags: [dev, editors, neovim]
    - name: Install Incus client
      ansible.builtin.package:
        name: incus-client
        state: present
      become: true
      tags: [containers, incus-client]
    - name: Configure Zed
      ansible.builtin.import_role:
        name: ../roles/client/zed
      tags: [dev, editors, zed]
    - name: Configure AI tools
      ansible.builtin.import_role:
        name: ../roles/client/ai-tools
      tags: [dev, ai-tools]
    - name: Configure local models
      ansible.builtin.import_role:
        name: ../roles/client/ollama
      tags: [ai, ollama]
