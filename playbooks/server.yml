---
- name: Configure server base
  ansible.builtin.import_playbook: base.yml
  vars:
    setup_hosts: server
  tags: [server]

- name: Configure server applications
  hosts: server
  tags: [server]
  tasks:
    - name: Configure server system
      ansible.builtin.import_tasks: tasks/server/system.yml
      tags: [system, cockpit, hermes, incus, containers, apps]
    - name: Configure Incus
      ansible.builtin.import_role:
        name: server/incus
      tags: [containers, incus]
    - name: Write Hermes deployment
      ansible.builtin.import_role:
        name: server/hermes
      tags: [apps, hermes]
    - name: Configure server backups
      ansible.builtin.import_role:
        name: server/restic
      tags: [backup, restic, rclone]
