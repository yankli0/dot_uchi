---
- name: Install terminal utilities
  ansible.builtin.package:
    name: [fzf, ripgrep, bat, btop, eza, zoxide]
    state: present
  become: true
  tags: [zsh, fzf, ripgrep, bat, btop, eza, zoxide]

- name: Configure Fastfetch
  ansible.builtin.import_role:
    name: ../roles/base/fastfetch
  tags: [fastfetch]

- name: Configure Starship
  ansible.builtin.import_role:
    name: ../roles/base/starship
  tags: [starship, zsh]

- name: Configure Zsh
  ansible.builtin.import_role:
    name: ../roles/base/zsh
  tags: [zsh]

- name: Configure tmux
  ansible.builtin.import_role:
    name: ../roles/base/tmux
  tags: [tmux]

- name: Configure Vim
  ansible.builtin.import_role:
    name: ../roles/base/vim
  tags: [vim]
