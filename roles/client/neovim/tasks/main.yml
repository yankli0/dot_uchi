---
- name: Setup neovim
  block:
    - name: Install neovim
      ansible.builtin.package:
        name: "{{ neovim_packages }}"
        state: present
      become: true

    - name: Create .config/nvim directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
        state: directory
        mode: "0755"

    - name: Ensure Node runtime is available for Neovim
      ansible.builtin.include_role:
        name: base/mise
      vars:
        mise_selected_tools: [node]

    - name: Copy neovim config
      ansible.builtin.copy:
        src: .config/nvim/
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/"
        mode: "0644"
        directory_mode: "0755"
        backup: true
