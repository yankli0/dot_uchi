---
- name: Setup zed
  block:
    - name: Check if zed is installed
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - "command -v zed"
      register: zed_check
      changed_when: false
      failed_when: zed_check.rc not in [0, 1, 127]
      check_mode: false
      environment:
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Install zed
      ansible.builtin.shell: "set -o pipefail; curl -fsSL {{ zed_install_url }} | sh"
      args:
        executable: /bin/bash
      when: zed_check.rc != 0

    - name: Create .config/zed directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zed"
        state: directory
        mode: "0755"

    - name: Copy zed config
      ansible.builtin.copy:
        src: .config/zed/private_settings.json
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/zed/private_settings.json"
        mode: "0600"
        backup: true
      no_log: true
