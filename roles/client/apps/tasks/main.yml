---
- name: Load application catalog
  ansible.builtin.include_vars:
    file: main.yml

- name: Validate app selection
  ansible.builtin.assert:
    that: client_apps | difference(apps_catalog.keys() | list) | length == 0
    fail_msg: "Unknown app ids: {{ client_apps | difference(apps_catalog.keys() | list) }}"

- name: Resolve selected app definitions
  ansible.builtin.set_fact:
    _apps_selected: "{{ client_apps | map('extract', apps_catalog) | list }}"

- name: Install Flatpak apps
  community.general.flatpak:
    name: "{{ _apps_selected | selectattr('type', 'equalto', 'flatpak') | map(attribute='id') | list }}"
    state: present
    method: user
  when: _apps_selected | selectattr('type', 'equalto', 'flatpak') | list | length > 0
