---
- name: Validate app selection
  ansible.builtin.assert:
    that: client_apps | difference(app_catalog.keys() | list) | length == 0
    fail_msg: "Unknown app ids in client_apps: {{ client_apps | difference(app_catalog.keys() | list) }}"

- name: Resolve selected app definitions
  ansible.builtin.set_fact:
    _selected_apps: "{{ client_apps | map('extract', app_catalog) | list }}"

- name: Install native app packages
  ansible.builtin.package:
    name: "{{ _selected_apps | selectattr('type','equalto','package') | map(attribute='id') | list }}"
    state: present
  become: true
  when: _selected_apps | selectattr('type','equalto','package') | list | length > 0

- name: Install Flatpak apps
  ansible.builtin.include_role:
    name: flatpak
  vars:
    flatpak_packages: "{{ _selected_apps | selectattr('type','equalto','flatpak') | map(attribute='id') | list }}"
  when: _selected_apps | selectattr('type','equalto','flatpak') | list | length > 0

- name: Run role-type apps
  ansible.builtin.include_role:
    name: "{{ item.role }}"
  loop: "{{ _selected_apps | selectattr('type','equalto','role') | list }}"
  when: _selected_apps | selectattr('type','equalto','role') | list | length > 0
