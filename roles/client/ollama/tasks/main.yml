---
- name: Setup ollama
  block:
    - name: Check if ollama is installed
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - "command -v ollama"
      register: ollama_check
      changed_when: false
      failed_when: ollama_check.rc not in [0, 1, 127]
      check_mode: false
      environment:
        PATH: "{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Install ollama
      ansible.builtin.shell: "set -o pipefail; curl -fsSL {{ ollama_install_url }} | sh"
      args:
        executable: /bin/bash
      become: true
      when: ollama_check.rc != 0
      changed_when: true

    - name: Enable ollama service
      ansible.builtin.systemd:
        name: ollama
        enabled: true
        state: started
      become: true
      failed_when: false
