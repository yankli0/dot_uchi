---
- name: Create AI configuration directories
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/{{ item }}"
    state: directory
    mode: "0755"
  loop: [opencode, mise/conf.d]

- name: Copy AI tool versions
  ansible.builtin.copy:
    src: ai.toml
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/mise/conf.d/ai.toml"
    mode: "0644"
    backup: true

- name: Inspect missing AI tools
  ansible.builtin.command:
    argv: ["{{ ansible_facts['env']['HOME'] }}/.local/bin/mise", ls, --missing, --json,
           opencode, claude-code, "npm:@earendil-works/pi-coding-agent"]
    chdir: "{{ ansible_facts['env']['HOME'] }}"
  register: ai_tools_missing
  changed_when: false
  when: not ansible_check_mode

- name: Install AI tools with mise
  ansible.builtin.command:
    argv: ["{{ ansible_facts['env']['HOME'] }}/.local/bin/mise", install,
           opencode, claude-code, "npm:@earendil-works/pi-coding-agent"]
    chdir: "{{ ansible_facts['env']['HOME'] }}"
  when:
    - not ansible_check_mode
    - ai_tools_missing.stdout | from_json | length > 0
  changed_when: true

- name: Copy OpenCode configuration
  ansible.builtin.copy:
    src: .config/opencode/
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/"
    mode: "0644"
    directory_mode: "0755"
    backup: true
