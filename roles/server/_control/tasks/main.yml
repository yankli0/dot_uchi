---
- name: Validate container action and app
  ansible.builtin.assert:
    that:
      - control_action in ['up', 'down', 'restart', 'status']
      - control_app == 'all' or control_app is match('^[a-zA-Z0-9][a-zA-Z0-9_-]*$')
    fail_msg: Choose up/down/restart/status and an app directory name.

- name: Run container control action
  ansible.builtin.include_tasks: "{{ control_action }}.yml"
