---
- name: Inspect existing job repository
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/restic/{{ restic_job }}.env"
  register: restic_job_env

- name: Read existing job repository
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.config/restic/{{ restic_job }}.env"
  register: restic_job_previous
  when: restic_job_env.stat.exists
  no_log: true

- name: Require explicit manual repository migration
  ansible.builtin.assert:
    that:
      - >-
        not restic_job_env.stat.exists or
        ('export RESTIC_REPOSITORY=' ~ (restic_job_repository | quote)) in
        ((restic_job_previous.content | default('') | b64decode).splitlines())
    fail_msg: >-
      Existing {{ restic_job }} repository differs. Disable its timer, preserve its environment
      and password, test the new repository and restore, then archive the old job environment
      manually before rerunning. Repository redirection is never automatic.

- name: Validate authorized and restore-tested enrollment
  when: restic_job_enabled | bool
  block:
    - name: Require restore verification for this repository
      ansible.builtin.assert:
        that: restic_job_verified_repository == restic_job_repository
        fail_msg: >-
          Set restic_{{ restic_job }}_restore_verified_repository to the exact repository
          after a successful restore test.

    - name: Inspect private backup credentials
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ ansible_facts['env']['HOME'] }}/.config/restic/{{ restic_job }}.password"
        - "{{ ansible_facts['env']['HOME'] }}/.config/rclone/rclone.conf"
      register: restic_job_credentials
      no_log: true

    - name: Require local backup credentials
      ansible.builtin.assert:
        that: >-
          restic_job_credentials.results | selectattr('stat.isreg', 'defined')
          | selectattr('stat.isreg') | list | length == 2
        fail_msg: Authorize rclone and create the separate private job password before enabling.
      no_log: true

    - name: Protect backup credentials
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0600"
      loop:
        - "{{ ansible_facts['env']['HOME'] }}/.config/restic/{{ restic_job }}.password"
        - "{{ ansible_facts['env']['HOME'] }}/.config/rclone/rclone.conf"
      no_log: true

    - name: Verify initialized repository access
      ansible.builtin.command:
        argv: [restic, snapshots, --json]
      environment:
        RESTIC_REPOSITORY: "{{ restic_job_repository }}"
        RESTIC_PASSWORD_FILE: "{{ ansible_facts['env']['HOME'] }}/.config/restic/{{ restic_job }}.password"
        RCLONE_CONFIG: "{{ ansible_facts['env']['HOME'] }}/.config/rclone/rclone.conf"
      changed_when: false
      when: not ansible_check_mode
      no_log: true

- name: Write private job environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/restic/{{ restic_job }}.env"
    mode: "0600"
    backup: true
  no_log: true

- name: Write job backup script
  ansible.builtin.template:
    src: restic-backup.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/restic-{{ restic_job }}-backup"
    mode: "0700"

- name: Write job service
  ansible.builtin.template:
    src: service.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/restic-{{ restic_job }}.service"
    mode: "0644"
  register: restic_job_service

- name: Write job timer
  ansible.builtin.template:
    src: timer.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/restic-{{ restic_job }}.timer"
    mode: "0644"
  register: restic_job_timer

- name: Enable lingering for enrolled backups
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ ansible_user }}"]
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"
  become: true
  when: restic_job_enabled | bool

- name: Configure independent backup timer
  ansible.builtin.systemd_service:
    name: "restic-{{ restic_job }}.timer"
    scope: user
    daemon_reload: "{{ restic_job_service.changed or restic_job_timer.changed }}"
    enabled: "{{ restic_job_enabled | bool }}"
    state: "{{ 'started' if restic_job_enabled | bool else 'stopped' }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
