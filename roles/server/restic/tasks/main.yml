---
- name: Install backup tools
  ansible.builtin.package:
    name: [rclone, restic, util-linux]
    state: present
  become: true
  tags: [packages]

- name: Create private backup configuration
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/restic"
    state: directory
    mode: "0700"

- name: Create service and script directories
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [.local/bin, .config/systemd/user]

- name: Inspect legacy backup configuration
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/restic/env"
  register: restic_legacy_env

- name: Inspect legacy backup timer
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/restic-backup.timer"
  register: restic_legacy_timer

- name: Require manual migration of an enabled legacy backup
  when: restic_legacy_env.stat.exists or restic_legacy_timer.stat.exists
  block:
    - name: Read legacy timer enrollment
      ansible.builtin.command:
        argv: [systemctl, --user, is-enabled, restic-backup.timer]
      register: restic_legacy_enabled
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read legacy timer activity
      ansible.builtin.command:
        argv: [systemctl, --user, is-active, restic-backup.timer, restic-backup.service]
      register: restic_legacy_active
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Preserve active legacy repository until explicit migration
      ansible.builtin.assert:
        that:
          - restic_legacy_enabled.stdout | trim not in ['enabled', 'enabled-runtime']
          - "'active' not in restic_legacy_active.stdout_lines"
        fail_msg: >-
          Existing restic-backup is enrolled or active. Its files and repository are preserved.
          Follow the manual migration procedure before configuring the independent jobs.

- name: Require independent core and apps repositories
  ansible.builtin.assert:
    that:
      - restic_core_repository | length > 0
      - restic_apps_repository | length > 0
      - restic_core_repository != restic_apps_repository
    fail_msg: Core and apps must use distinct nonempty repository URIs.
  when: "'server' in group_names"

- name: Configure core backup job
  ansible.builtin.include_tasks: job.yml
  vars:
    restic_job: core
    restic_job_repository: "{{ restic_core_repository }}"
    restic_job_enabled: "{{ restic_core_enabled }}"
    restic_job_verified_repository: "{{ restic_core_restore_verified_repository }}"
    restic_job_hour: "03"

- name: Configure server app backup job
  ansible.builtin.include_tasks: job.yml
  vars:
    restic_job: apps
    restic_job_repository: "{{ restic_apps_repository }}"
    restic_job_enabled: "{{ restic_apps_enabled }}"
    restic_job_verified_repository: "{{ restic_apps_restore_verified_repository }}"
    restic_job_hour: "04"
  when: "'server' in group_names"
