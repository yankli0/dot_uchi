---
- name: Install Incus
  ansible.builtin.package:
    name: incus
    state: present
  become: true

- name: Configure subordinate IDs without replacing existing mappings
  ansible.builtin.include_tasks: subids.yml
  loop: [/etc/subuid, /etc/subgid]
  loop_control:
    loop_var: incus_subid_file
  tags: [subids]

- name: Enable Incus service
  ansible.builtin.systemd_service:
    name: incus.service
    enabled: true
    state: started
  become: true

- name: Grant Incus administration access
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: incus-admin
    append: true
  become: true

- name: Read Tailscale IPv4 address
  ansible.builtin.command:
    argv: [tailscale, ip, -4]
  register: incus_tailnet
  changed_when: false
  failed_when: incus_tailnet.rc not in [0, 1]
  when: not ansible_check_mode

- name: Configure Incus on the tailnet
  when:
    - not ansible_check_mode
    - incus_tailnet.rc == 0
    - incus_tailnet.stdout | trim | length > 0
  become: true
  block:
    - name: Read Incus HTTPS address
      ansible.builtin.command:
        argv: [incus, config, get, core.https_address]
      register: incus_https
      changed_when: false

    - name: Bind Incus HTTPS to Tailscale
      ansible.builtin.command:
        argv: [incus, config, set, core.https_address, "{{ incus_tailnet.stdout | trim }}:8443"]
      when: incus_https.stdout | trim != (incus_tailnet.stdout | trim) ~ ':8443'
      changed_when: true

- name: Read Incus networks
  ansible.builtin.command:
    argv: [incus, network, list, --format=json]
  register: incus_networks
  changed_when: false
  become: true
  when: not ansible_check_mode

- name: Configure existing Incus bridge
  when:
    - not ansible_check_mode
    - "'incusbr0' in (incus_networks.stdout | from_json | map(attribute='name') | list)"
  become: true
  block:
    - name: Read bridge firewall settings
      ansible.builtin.command:
        argv: [incus, network, get, incusbr0, "{{ item }}"]
      loop: [ipv4.firewall, ipv6.firewall]
      register: incus_bridge_firewall
      changed_when: false

    - name: Delegate bridge firewall to firewalld
      ansible.builtin.command:
        argv: [incus, network, set, incusbr0, "{{ item.item }}", "false"]
      loop: "{{ incus_bridge_firewall.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout | trim != 'false'
      changed_when: true

    - name: Trust Incus bridge traffic
      ansible.posix.firewalld:
        zone: trusted
        interface: incusbr0
        state: enabled
        permanent: true
        immediate: true
