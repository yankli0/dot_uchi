---
# Development workspace directory and tool set.
# Per-host selection via host vars, e.g.:
#   env_selected_tools: [node, go]
env_dir: "{{ user_home }}/dev"

env_tools:
  node: {tool: node, version: latest}
  deno: {tool: deno, version: latest}
  go: {tool: go, version: latest}
  python: {tool: python, version: latest}
  rust: {tool: rust, version: latest}

env_selected_tools: "{{ env_tools.keys() | list }}"

# tool@version specs for a single mise invocation.
env_tool_specs: >-
  {{ env_selected_tools
     | zip(env_selected_tools | map('extract', env_tools) | map(attribute='version'))
     | map('join', '@')
     | list }}

# Ordering: run the mise role before this one — the workspace trusts mise
# and calls the mise binary installed by it.
