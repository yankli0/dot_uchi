---
# Terminal utilities installed from Fedora repos, plus CLIs that track
# upstream releases via mise (conf.d/terminal-tools.toml).
terminal_tools_packages:
  - fzf
  - ripgrep
  - bat
  - btop
  - htop
  - eza
  - zoxide
  - fastfetch
  - tmux
  - vim

# Tools via mise; narrow or pin per host, e.g.
#   terminal_tools_mise:
#     lazygit: {tool: lazygit, version: "0.53.0"}
terminal_tools_mise:
  lazygit: {tool: lazygit, version: latest}
  gh: {tool: gh, version: latest}
  lazydocker: {tool: lazydocker, version: latest}
