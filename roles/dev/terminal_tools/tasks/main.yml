---
- name: Install terminal utilities
  ansible.builtin.package:
    name: "{{ terminal_tools_packages }}"
    state: present
  become: true

- name: Create the Fastfetch configuration directory
  ansible.builtin.file:
    path: "{{ user_config_dir }}/fastfetch"
    state: directory
    mode: "0755"
  become: false

- name: Deploy Fastfetch configuration
  ansible.builtin.copy:
    src: fastfetch.jsonc
    dest: "{{ user_config_dir }}/fastfetch/config.jsonc"
    mode: "0644"
  become: false

- name: Ensure the mise conf.d directory exists
  ansible.builtin.file:
    path: "{{ user_config_dir }}/mise/conf.d"
    state: directory
    mode: "0755"
  become: false

- name: Deploy the dev-CLI mise configuration
  ansible.builtin.template:
    src: terminal-tools.toml.j2
    dest: "{{ user_config_dir }}/mise/conf.d/terminal-tools.toml"
    mode: "0644"
  become: false

- name: Plan dev CLI installation
  ansible.builtin.command:
    argv: ["{{ user_bin_dir }}/mise", "install", "--dry-run-code"]
    chdir: "{{ user_home }}"
  register: _terminal_tools_plan
  changed_when: false
  failed_when: _terminal_tools_plan.rc not in [0, 1]
  when: not ansible_check_mode
  become: false
  environment:
    PATH: "{{ user_path | default(user_bin_dir ~ ':' ~ ansible_facts['env']['PATH']) }}"

- name: Install dev CLIs with mise
  ansible.builtin.command:
    argv: ["{{ user_bin_dir }}/mise", "install"]
    chdir: "{{ user_home }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - _terminal_tools_plan.rc | default(0) == 1
  become: false
  environment:
    PATH: "{{ user_path | default(user_bin_dir ~ ':' ~ ansible_facts['env']['PATH']) }}"

- name: Build mise shims for the dev CLIs
  ansible.builtin.command:
    argv: ["{{ user_bin_dir }}/mise", "reshim"]
  when:
    - not ansible_check_mode
    - _terminal_tools_plan.rc | default(0) == 1
  changed_when: false
  become: false
  environment:
    PATH: "{{ user_path | default(user_bin_dir ~ ':' ~ ansible_facts['env']['PATH']) }}"
