---
- name: Check if Tailscale is installed
  ansible.builtin.command:
    argv: [sh, -c, "command -v tailscale"]
  register: tailscale_check
  changed_when: false
  failed_when: tailscale_check.rc not in [0, 1, 127]
  check_mode: false
  environment:
    PATH: "{{ user_path }}"

- name: Install Tailscale
  ansible.builtin.shell: "set -o pipefail; curl -fsSL {{ tailscale_install_url }} | sh"
  args:
    executable: /bin/bash
  become: true
  when: tailscale_check.rc != 0
  changed_when: true

- name: Check if firewalld is running
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, firewalld]
  register: _tailscale_firewalld_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Trust Tailscale interface through firewalld
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    state: enabled
    permanent: true
    immediate: true
  become: true
  when: _tailscale_firewalld_active.rc == 0
