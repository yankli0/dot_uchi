---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Setup tailscale
  block:
    - name: Check if tailscale is installed
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - "command -v tailscale"
      register: tailscale_check
      changed_when: false
      failed_when: tailscale_check.rc not in [0, 1, 127]
      check_mode: false
      environment:
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Install tailscale
      ansible.builtin.shell: "set -o pipefail; curl -fsSL {{ tailscale_install_url }} | sh"
      args:
        executable: /bin/bash
      become: true
      when: tailscale_check.rc != 0
      changed_when: true

- name: Trust Tailscale traffic through firewalld
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    state: enabled
    permanent: true
    immediate: true
  become: true
  when:
    - ansible_facts.services is defined
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'
