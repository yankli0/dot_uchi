# Shared prompt for client and server; uses plain text symbols.
add_newline = false
format = "$username$hostname$directory$git_branch$git_status$cmd_duration$character"

[username]
show_always = true
format = "[$user]($style)"
style_user = "green"

[hostname]
ssh_only = false
format = "[@$hostname]($style) "
style = "green"

[directory]
style = "blue"
read_only = " ro"

[git_branch]
symbol = "git "

[git_status]
ahead = ">"
behind = "<"
diverged = "<>"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"
