---
- name: Install password CLI prerequisites
  ansible.builtin.package:
    name: [curl, jq]
    state: present
  become: true

- name: Check Proton Pass CLI
  ansible.builtin.command:
    argv: [sh, -c, "command -v pass-cli"]
  register: passwords_cli_check
  changed_when: false
  failed_when: passwords_cli_check.rc not in [0, 1, 127]
  check_mode: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install Proton Pass CLI
  when: passwords_cli_check.rc != 0
  block:
    - name: Create user installer directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [.cache/dot-uchi, .local/bin]

    - name: Download Proton Pass CLI installer
      ansible.builtin.get_url:
        url: https://proton.me/download/pass-cli/install.sh
        dest: "{{ ansible_facts['env']['HOME'] }}/.cache/dot-uchi/pass-cli-install.sh"
        mode: "0700"

    - name: Run Proton Pass CLI installer
      ansible.builtin.command:
        argv: [bash, "{{ ansible_facts['env']['HOME'] }}/.cache/dot-uchi/pass-cli-install.sh"]
      changed_when: true
      environment:
        PROTON_PASS_CLI_INSTALL_DIR: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
