---
# Syncthing — continuous file synchronization, per-user service.
# Requires the user-lingering set up by the system role.
- name: Install Syncthing
  ansible.builtin.package:
    name: syncthing
    state: present
  become: true

- name: Enable Syncthing user service
  ansible.builtin.systemd:
    name: syncthing.service
    scope: user
    state: started
    enabled: true
  become: false
