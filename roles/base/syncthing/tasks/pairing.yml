---
- name: Read live Syncthing configuration
  ansible.builtin.command:
    argv: [syncthing, cli, config, dump-json]
  register: syncthing_config
  changed_when: false
  retries: 10
  delay: 2
  until: syncthing_config.rc == 0
  when: not ansible_check_mode
  no_log: true

- name: Record live Syncthing configuration
  ansible.builtin.set_fact:
    syncthing_current: "{{ syncthing_config.stdout | from_json }}"
  when: not ansible_check_mode
  no_log: true

- name: Read this endpoint identity before pairing
  ansible.builtin.command:
    argv: [syncthing, cli, show, system]
  register: syncthing_system
  changed_when: false
  when: not ansible_check_mode
  no_log: true

- name: Reject pairing this endpoint with itself
  ansible.builtin.assert:
    that: >-
      (syncthing_system.stdout | from_json).myID
      not in (syncthing_devices | map(attribute='id') | list)
    fail_msg: A declared peer ID belongs to this endpoint. Correct the inventory device IDs.
  when: not ansible_check_mode

- name: Add declared peers
  ansible.builtin.command:
    argv: [syncthing, cli, config, devices, add, --device-id, "{{ item.id }}", --name, "{{ item.name }}"]
  loop: "{{ syncthing_devices }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - item.id not in (syncthing_current.devices | map(attribute='deviceID') | list)
  changed_when: true

- name: Update existing peer names
  ansible.builtin.command:
    argv: [syncthing, cli, config, devices, "{{ item.id }}", name, set, "{{ item.name }}"]
  loop: "{{ syncthing_devices }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - item.id in (syncthing_current.devices | map(attribute='deviceID') | list)
    - >-
      (syncthing_current.devices | selectattr('deviceID', 'equalto', item.id) | first).name != item.name
  changed_when: true

- name: Configure declared folders and peer sharing
  ansible.builtin.include_tasks: folder.yml
  loop: "{{ syncthing_folders }}"
  loop_control:
    loop_var: syncthing_folder
    label: "{{ syncthing_folder.id }}"
  when: not ansible_check_mode

- name: Show this machine's device ID
  ansible.builtin.debug:
    msg: >-
      Syncthing configured for {{ inventory_hostname }}; device ID: {{ (syncthing_system.stdout | from_json).myID }}.
      Add it to syncthing_device_ids and configure mutual peers on both endpoints.
      Connectivity and synchronization completion have not been checked.
  when: not ansible_check_mode
