---
- name: Require an absolute canonical core path
  ansible.builtin.assert:
    that:
      - core_path is defined
      - core_path | default('') is match('^/.+')
    fail_msg: Define core_path in host variables.

- name: Verify expected external mount before any directory creation
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, "{{ core_expected_mount }}", --noheadings, --output, TARGET]
  register: core_mount
  changed_when: false
  check_mode: false
  when: core_expected_mount | length > 0

- name: Inspect canonical core directory
  ansible.builtin.stat:
    path: "{{ core_path }}"
  register: core_directory

- name: Require existing core or explicit creation permission
  ansible.builtin.assert:
    that:
      - core_directory.stat.exists or core_create_if_missing | bool
      - not core_directory.stat.exists or core_directory.stat.isdir | default(false)
    fail_msg: Core must be a directory; creation requires core_create_if_missing=true.

- name: Create explicitly permitted core directory
  ansible.builtin.file:
    path: "{{ core_path }}"
    state: directory
    mode: "0755"
  when:
    - not core_directory.stat.exists
    - core_create_if_missing | bool

- name: Check core access as configured user
  ansible.builtin.command:
    argv: [test, -r, "{{ core_path }}", -a, -w, "{{ core_path }}", -a, -x, "{{ core_path }}"]
  changed_when: false
  when: not ansible_check_mode or core_directory.stat.exists
