---
- name: Install Zsh and plugins
  ansible.builtin.package:
    name: "{{ zsh_packages }}"
    state: present
  become: true

- name: Create shell configuration and installer directories
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [.config, .local/bin, .cache/dot-uchi]

- name: Copy shared Zsh configuration
  ansible.builtin.copy:
    src: .zshrc
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    mode: "0644"
    backup: true

- name: Set Zsh as login shell
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: /usr/bin/zsh
  become: true
