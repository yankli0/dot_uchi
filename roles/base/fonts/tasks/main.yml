---
- name: Ensure user fonts directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/fonts/{{ fonts_catalog[font_key].dir }}"
    state: directory
    mode: "0755"
  loop: "{{ fonts_install_list }}"
  loop_control:
    loop_var: font_key
  become: false

- name: Check if fonts are installed
  ansible.builtin.stat:
    path: "{{ user_home }}/.local/share/fonts/{{ fonts_catalog[font_key].dir }}/{{ fonts_catalog[font_key].marker }}"
  loop: "{{ fonts_install_list }}"
  loop_control:
    loop_var: font_key
  register: fonts_checks
  become: false

- name: Download fonts
  ansible.builtin.get_url:
    url: "{{ fonts_catalog[item.0].url }}"
    dest: "{{ user_cache_dir }}/{{ fonts_catalog[item.0].archive }}"
    checksum: "{{ fonts_catalog[item.0].checksum }}"
    mode: "0644"
  loop: "{{ fonts_install_list | zip(fonts_checks.results) | list }}"
  loop_control:
    loop_var: item
    label: "{{ fonts_catalog[item.0].family }}"
  when:
    - not item.1.stat.exists
    - not ansible_check_mode
  become: false

- name: Install fonts
  ansible.builtin.unarchive:
    src: "{{ user_cache_dir }}/{{ fonts_catalog[item.0].archive }}"
    dest: "{{ user_home }}/.local/share/fonts/{{ fonts_catalog[item.0].dir }}"
    remote_src: true
    include:
      - "*.ttf"
  loop: "{{ fonts_install_list | zip(fonts_checks.results) | list }}"
  loop_control:
    loop_var: item
    label: "{{ fonts_catalog[item.0].family }}"
  when:
    - not item.1.stat.exists
    - not ansible_check_mode
  notify: Refresh font cache
  become: false

# Optional: hosts can register the default monospace font for the COSMIC
# toolkit (this is how COSMIC picks up a Nerd Font), via host var:
#   cosmic_mono_font_family: "<font family name>"
- name: Create COSMIC toolkit configuration directory
  ansible.builtin.file:
    path: "{{ user_config_dir }}/cosmic/com.system76.CosmicTk/v1"
    state: directory
    mode: "0755"
  become: false
  when: cosmic_mono_font_family is defined and cosmic_mono_font_family | length > 0

- name: Register COSMIC toolkit monospace font
  ansible.builtin.copy:
    content: |
      (
          family: "{{ cosmic_mono_font_family }}",
          weight: Normal,
          stretch: Normal,
          style: Normal,
      )
    dest: "{{ user_config_dir }}/cosmic/com.system76.CosmicTk/v1/monospace_font"
    mode: "0644"
  become: false
  when: cosmic_mono_font_family is defined and cosmic_mono_font_family | length > 0
