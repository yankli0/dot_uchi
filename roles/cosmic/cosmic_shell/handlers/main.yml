---
# cosmic-panel is supervised by cosmic-session and respawns when terminated
# (verified live), which reloads shell config wedged on hot changes.
# Guard: only signal it when it is actually running, so headless/check runs
# are unaffected.
- name: Check whether the COSMIC panel process is running
  ansible.builtin.command:
    argv: [pgrep, -x, cosmic-panel]
  register: _cosmic_shell_panel_running
  changed_when: false
  failed_when: false
  check_mode: false

- name: Restart cosmic-panel
  ansible.builtin.command:
    argv: [killall, cosmic-panel]
  when: _cosmic_shell_panel_running.rc == 0
  changed_when: true
