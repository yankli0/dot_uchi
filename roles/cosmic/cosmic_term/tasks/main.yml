---
- name: Ensure Cosmic Terminal config directory exists
  ansible.builtin.file:
    path: "{{ user_config_dir }}/cosmic/com.system76.CosmicTerm/v1"
    state: directory
    mode: "0755"
  become: false

- name: Configure Cosmic Terminal monospace font
  ansible.builtin.copy:
    content: |
      (
          family: "{{ cosmic_term_font_family }}",
          weight: Normal,
          stretch: Normal,
          style: Normal,
      )
    dest: "{{ user_config_dir }}/cosmic/com.system76.CosmicTerm/v1/monospace_font"
    mode: "0644"
  become: false

- name: Configure Cosmic Terminal profile
  ansible.builtin.copy:
    content: |
      (
          name: "default",
          font_family: "{{ cosmic_term_font_family }}",
          font_size: {{ cosmic_term_font_size }},
      )
    dest: "{{ user_config_dir }}/cosmic/com.system76.CosmicTerm/v1/profile"
    mode: "0644"
  become: false
