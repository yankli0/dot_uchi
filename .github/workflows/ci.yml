---
name: ci
"on":
  push:
    branches: [uchi]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: pip install yamllint ansible ansible-lint pytest

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: YAML lint
        run: yamllint assets inventory playbooks roles callback_plugins

      - name: Ansible lint
        run: ansible-lint

      - name: Syntax check
        run: |
          ansible-playbook playbooks/brisingamen.yml --syntax-check
          ansible-playbook playbooks/gleipnir.yml --syntax-check

      - name: Structural tests
        run: pytest -q tests/

  check-mode:
    # Check-mode run on a Fedora container (COSMIC/GNOME-free parts are
    # skipped by check mode; system packages resolve but nothing installs).
    # Verifies the playbooks survive a real target environment.
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          dnf install -y ansible-core ansible-lint python3-pytest
          ansible-galaxy collection install -r requirements.yml

      - name: Check-mode run (- cosmic tasks only, no sudo needed)
        run: ansible-playbook playbooks/brisingamen.yml --tags cosmic,editors --check --diff
