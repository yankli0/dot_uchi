[defaults]
inventory            = ./inventory/hosts.yml
# Leaf role directories; roles import each other by leaf name (git, ssh_agent, …).
roles_path           = ./roles/base:./roles/generic
inject_facts_as_vars = False

# ── Performance ───────────────────────────────────────────────────────────────
# Reuse cached facts between runs instead of re-gathering everything.
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = ./.ansible/facts
fact_caching_timeout    = 3600
# Execute modules over the existing connection (helps SSH targets).
pipelining              = True
# Parallelism for multi-host inventories.
forks                   = 20
# Skip interpreter discovery warnings on the second and later runs.
interpreter_python      = auto_silent
# Minimal output
stdout_callback         = role_tree
callback_plugins        = ../ansible/callback_plugins
# Keep output focused on changes and failures.
# (display_skipped_hosts/display_ok_hosts need the default callback to take
# effect, and this repo uses role_tree — so skip markers are shown inline as
# [-] lines instead of being hidden.)
show_task_path_on_failure = False
show_per_host_start     = False
deprecation_warnings    = False
command_warnings        = False
retry_files_enabled     = False
# Cleaner output
nocows                  = 1
# Vault password is fetched from Proton Pass at run time (see scripts/).
vault_password_file = ../scripts/vault-pass.sh

[privilege_escalation]
become_method   = sudo
become_user     = root
become_ask_pass = True
