[defaults]
inventory            = ./inventory/hosts.yml
# Leaf role directories; roles import each other by leaf name (system, fonts, …).
roles_path           = ./roles/base:./roles/client:./roles/cosmic:./roles/dev
inject_facts_as_vars = False

# ── Performance ───────────────────────────────────────────────────────────────
# Reuse cached facts between runs instead of re-gathering everything.
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = ./.ansible/facts
fact_caching_timeout    = 3600
# Execute modules over the existing connection (helps SSH targets).
pipelining              = True
# Parallelism for multi-host inventories.
forks                   = 20
# Skip interpreter discovery warnings on the second and later runs.
interpreter_python      = auto_silent
# Minimal output
stdout_callback         = role_tree
callback_plugins        = ../ansible/callback_plugins
# Keep output focused on changes and failures.
display_skipped_hosts   = False
display_ok_hosts        = False
show_task_path_on_failure = False
show_per_host_start     = False
deprecation_warnings    = False
command_warnings        = False
retry_files_enabled     = False
# Cleaner output
nocows                  = 1

[privilege_escalation]
become_method   = sudo
become_user     = root
become_ask_pass = True
