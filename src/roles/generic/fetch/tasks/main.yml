---
# Pinned downloads that land outside chezmoi: fonts, Flathub, VS Code repo.
- name: Add user Flathub remote
  community.general.flatpak_remote:
    name: flathub
    state: present
    method: user
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
  become: false

- name: Ensure user fonts directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/fonts/{{ fonts_catalog[font_key].dir }}"
    state: directory
    mode: "0755"
  loop: "{{ fonts_install_list }}"
  loop_control:
    loop_var: font_key
  become: false

- name: Check if fonts are installed
  ansible.builtin.stat:
    path: "{{ user_home }}/.local/share/fonts/{{ fonts_catalog[font_key].dir }}/{{ fonts_catalog[font_key].marker }}"
  loop: "{{ fonts_install_list }}"
  loop_control:
    loop_var: font_key
  register: _fetch_fonts_checks
  become: false

- name: Download fonts
  ansible.builtin.get_url:
    url: "{{ fonts_catalog[item.0].url }}"
    dest: "{{ user_cache_dir }}/{{ fonts_catalog[item.0].archive }}"
    checksum: "{{ fonts_catalog[item.0].checksum }}"
    mode: "0644"
  loop: "{{ fonts_install_list | zip(_fetch_fonts_checks.results | default([])) | list }}"
  loop_control:
    loop_var: item
    label: "{{ fonts_catalog[item.0].family }}"
  when:
    - not item.1.stat.exists
    - not ansible_check_mode
  become: false

- name: Install fonts
  ansible.builtin.unarchive:
    src: "{{ user_cache_dir }}/{{ fonts_catalog[item.0].archive }}"
    dest: "{{ user_home }}/.local/share/fonts/{{ fonts_catalog[item.0].dir }}"
    remote_src: true
    include:
      - "*.ttf"
  loop: "{{ fonts_install_list | zip(_fetch_fonts_checks.results | default([])) | list }}"
  loop_control:
    loop_var: item
    label: "{{ fonts_catalog[item.0].family }}"
  when:
    - not item.1.stat.exists
    - not ansible_check_mode
  notify: Refresh font cache
  become: false

- name: Register COSMIC toolkit monospace font
  ansible.builtin.copy:
    content: |
      (
          family: "{{ cosmic_mono_font_family }}",
          weight: Normal,
          stretch: Normal,
          style: Normal,
      )
    dest: "{{ user_config_dir }}/cosmic/com.system76.CosmicTk/v1/monospace_font"
    mode: "0644"
  become: false
  when: cosmic_mono_font_family is defined and cosmic_mono_font_family | length > 0

- name: Ensure chezmoi config directory exists
  ansible.builtin.file:
    path: "{{ user_config_dir }}/chezmoi"
    state: directory
    mode: "0755"
  become: false
  tags: [dotfiles]

- name: Render chezmoi template data for this host
  ansible.builtin.template:
    src: chezmoi-data.yaml.j2
    dest: "{{ user_config_dir }}/chezmoi/chezmoi.yaml"
    mode: "0600"
  become: false
  tags: [dotfiles]

- name: Import Microsoft repository GPG key
  ansible.builtin.rpm_key:
    state: present
    key: https://packages.microsoft.com/keys/microsoft.asc
  become: true

- name: Configure Visual Studio Code repository
  ansible.builtin.copy:
    content: |
      [code]
      name=Visual Studio Code
      baseurl=https://packages.microsoft.com/yumrepos/vscode
      enabled=1
      gpgcheck=1
      gpgkey=https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/yum.repos.d/vscode.repo
    mode: "0644"
  become: true
