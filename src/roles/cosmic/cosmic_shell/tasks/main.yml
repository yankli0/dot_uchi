---
# Deploys the per-host COSMIC shell layout (panel/dock position, size,
# applets, gaps) snapshot from assets/cosmic-shell/<host>/.
# Snapshot provenance + refresh procedure: assets/cosmic-shell/README.md.
- name: Locate COSMIC shell snapshot for this host
  ansible.builtin.stat:
    path: "{{ assets_dir }}/cosmic-shell/{{ inventory_hostname }}"
  register: _cosmic_shell_snapshot

- name: Fail when the host snapshot is missing
  ansible.builtin.assert:
    that: _cosmic_shell_snapshot.stat.exists
    fail_msg: >-
      No COSMIC shell snapshot for '{{ inventory_hostname }}' in
      assets/cosmic-shell/. Capture the panel/dock config from the machine
      (see assets/cosmic-shell/README.md) or unset the cosmic_shell import.

- name: Deploy COSMIC panel and dock configuration
  ansible.builtin.copy:
    src: "{{ assets_dir }}/cosmic-shell/{{ inventory_hostname }}/"
    dest: "{{ user_config_dir }}/cosmic/"
    mode: preserve
  become: false
  notify:
    - Check whether the COSMIC panel process is running
    - Restart cosmic-panel
