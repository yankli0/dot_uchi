---
- name: Ensure AI tool directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ user_bin_dir }}"
    - "{{ user_cache_dir }}"
  become: false

- name: Check installed AI tools
  ansible.builtin.stat:
    path: "{{ item.value.bin }}"
  loop: "{{ ai_tools_catalog | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _ai_tools_checks

- name: Download AI tool installers
  ansible.builtin.get_url:
    url: "{{ item.item.value.url }}"
    dest: "{{ user_cache_dir }}/{{ item.item.key }}-install.sh"
    mode: "0700"
  loop: "{{ _ai_tools_checks.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.item.key in ai_tools_selected
    - not item.stat.exists
  become: false

- name: Install AI tools
  ansible.builtin.command:
    argv:
      - "{{ item.item.value.shell }}"
      - "{{ user_cache_dir }}/{{ item.item.key }}-install.sh"
    creates: "{{ item.item.value.bin }}"
  loop: "{{ _ai_tools_checks.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.item.key in ai_tools_selected
    - not item.stat.exists
  become: false
  changed_when: true
  environment:
    PATH: "{{ ai_tools_path }}"

# OpenCode keeps its binary in ~/.opencode/bin, which is not in the managed
# shell PATH. Link it into ~/.local/bin so fresh shells resolve it.
- name: Expose OpenCode on the managed PATH
  ansible.builtin.file:
    src: "{{ ai_tools_catalog.opencode.bin }}"
    dest: "{{ user_bin_dir }}/opencode"
    state: link
    force: true
  when: "'opencode' in ai_tools_selected"
  become: false

# ── Command Code ──────────────────────────────────────────────────────────────
# https://commandcode.ai — CLI: npm package `command-code` (bins cmd/command-code
# /commandcode, installed under the mise node prefix); Desktop: AppImage from the
# CommandCodeAI/desktop GitHub releases (Fedora has no .deb/apt path; the
# AppImage needs no root and no separate CLI install).
- name: Check Command Code CLI installation
  ansible.builtin.command:
    argv: [sh, -c, "command -v command-code"]
  changed_when: false
  failed_when: false
  check_mode: false
  register: _ai_tools_command_code_cli
  when: "'command_code_cli' in ai_tools_extra"
  environment:
    PATH: "{{ user_home }}/.local/share/mise/shims:{{ user_path }}"

- name: Install Command Code CLI
  ansible.builtin.command:
    argv:
      - "{{ user_home }}/.local/share/mise/shims/npm"
      - install
      - -g
      - command-code
  changed_when: true
  become: false
  when:
    - "'command_code_cli' in ai_tools_extra"
    - _ai_tools_command_code_cli.rc | default(1) != 0

- name: Check Command Code Desktop release channel
  ansible.builtin.uri:
    url: https://api.github.com/repos/CommandCodeAI/desktop/releases/latest
    return_content: true
  register: _ai_tools_command_code_release
  when: "'command_code_desktop' in ai_tools_extra"

- name: Resolve Command Code Desktop AppImage
  ansible.builtin.set_fact:
    _ai_tools_command_code_appimage: "{{ _ai_tools_command_code_release.json.assets
      | selectattr('name', 'match', 'CommandCode-[0-9.]+-x86_64.AppImage')
      | map(attribute='browser_download_url') | first }}"
  when: "'command_code_desktop' in ai_tools_extra"

- name: Check installed Command Code Desktop version stamp
  ansible.builtin.slurp:
    src: "{{ user_cache_dir }}/command-code-desktop.version"
  register: _ai_tools_command_code_stamp
  failed_when: false
  check_mode: false
  when: "'command_code_desktop' in ai_tools_extra"

- name: Install Command Code Desktop
  when: >-
    'command_code_desktop' in ai_tools_extra
    and (_ai_tools_command_code_stamp.content | b64decode | default('') | trim
         != _ai_tools_command_code_release.json.tag_name)
  block:
    - name: Download Command Code Desktop AppImage
      ansible.builtin.get_url:
        url: "{{ _ai_tools_command_code_appimage }}"
        dest: "{{ user_cache_dir }}/command-code-desktop.AppImage"
        mode: "0755"

    - name: Place Command Code Desktop on the managed PATH
      ansible.builtin.copy:
        src: "{{ user_cache_dir }}/command-code-desktop.AppImage"
        dest: "{{ user_bin_dir }}/command-code-desktop"
        mode: "0755"

    - name: Record installed Command Code Desktop version
      ansible.builtin.copy:
        content: "{{ _ai_tools_command_code_release.json.tag_name }}\n"
        dest: "{{ user_cache_dir }}/command-code-desktop.version"
        mode: "0644"
