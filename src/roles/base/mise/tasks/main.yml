---
- name: Create mise directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: ["{{ user_bin_dir }}", "{{ user_cache_dir }}"]

- name: Check mise installation
  ansible.builtin.stat:
    path: "{{ user_bin_dir }}/mise"
  register: mise_binary

- name: Install mise
  when: not mise_binary.stat.exists
  block:
    - name: Download mise installer
      ansible.builtin.get_url:
        url: https://mise.run
        dest: "{{ user_cache_dir }}/mise-install.sh"
        mode: "0700"

    - name: Run mise installer
      ansible.builtin.command:
        argv: [sh, "{{ user_cache_dir }}/mise-install.sh"]
        creates: "{{ user_bin_dir }}/mise"
      changed_when: true
      environment:
        MISE_INSTALL_PATH: "{{ user_bin_dir }}/mise"

- name: Ensure legacy global runtime config is removed
  ansible.builtin.file:
    path: "{{ user_config_dir }}/mise/conf.d/dot-uchi.toml"
    state: absent

- name: Ensure mise config directory exists
  ansible.builtin.file:
    path: "{{ mise_config_dir }}"
    state: directory
    mode: "0755"

# Global tools keep CLIs such as `pi` working outside the dev workspace.
- name: Deploy global mise configuration
  ansible.builtin.template:
    src: mise.toml.j2
    dest: "{{ mise_config_dir }}/config.toml"
    mode: "0644"

- name: Check mise installation after install
  ansible.builtin.stat:
    path: "{{ mise_bin }}"
  register: _mise_bin

- name: Plan global mise tool installation
  ansible.builtin.command:
    argv: ["{{ mise_bin }}", "install", "--dry-run-code"]
    chdir: "{{ user_home }}"
  register: _mise_global_plan
  changed_when: false
  failed_when: _mise_global_plan.rc not in [0, 1]
  when:
    - not ansible_check_mode
    - _mise_bin.stat.exists | default(false)

- name: Install global mise tools
  ansible.builtin.command:
    argv: ["{{ mise_bin }}", "install"]
    chdir: "{{ user_home }}"
  when:
    - not ansible_check_mode
    - _mise_bin.stat.exists | default(false)
    - _mise_global_plan.rc | default(0) == 1
  changed_when: true

- name: Build global mise shims
  ansible.builtin.command:
    argv: ["{{ mise_bin }}", "reshim"]
    chdir: "{{ user_home }}"
  when:
    - not ansible_check_mode
    - _mise_bin.stat.exists | default(false)
    - _mise_global_plan.rc | default(0) == 1
  changed_when: false

- name: Activate mise in Bash
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.bashrc"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: mise activation"
    block: |
      export PATH="$HOME/.local/bin:$PATH"
      if command -v mise >/dev/null 2>&1; then
        eval "$(mise activate bash)"
      fi

# Zsh activation lives in the shell configuration owned by base/zsh.
- name: Activate mise in POSIX login shells
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.profile"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: mise activation"
    block: |
      export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
