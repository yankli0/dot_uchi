---
- name: Install Zsh and plugins
  ansible.builtin.package:
    name: "{{ zsh_packages }}"
    state: present
  become: true

- name: Deploy shared Zsh configuration
  ansible.builtin.copy:
    src: .zshrc
    dest: "{{ user_home }}/.zshrc"
    mode: "0644"
    backup: true
  become: false

- name: Set Zsh as login shell
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: /usr/bin/zsh
  become: true
